name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The repo name becomes the subpath GitHub Pages serves this at
      # (https://<user>.github.io/<repo>/), so the web build needs to know it
      # up front to resolve its own asset links correctly.
      - name: Export static web build
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      # Static export doesn't add this, and without it GitHub Pages' Jekyll
      # processing will ignore files/folders starting with an underscore
      # (e.g. the _expo directory Expo's web build outputs assets into).
      - run: touch dist/.nojekyll

      # GitHub Pages serves 404.html for any unmatched URL. This is a single-page app, so
      # reusing index.html there means a reload or bookmark deep in the book still loads it.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
